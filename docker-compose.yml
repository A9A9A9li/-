version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 مع امتداد pgvector مثبَّت مسبقاً
    restart: unless-stopped
    environment:
      POSTGRES_USER: meethaq_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_local_only}
      POSTGRES_DB: meethaq
    ports:
      - "5432:5432"
    volumes:
      - meethaq_db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meethaq_app -d meethaq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://meethaq_app:${DB_PASSWORD:-change_me_local_only}@db:5432/meethaq
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  meethaq_db_data:
