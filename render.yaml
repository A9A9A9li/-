# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: meethaq-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meethaq-db
          property: connectionString
      # الاتصال يتم عبر شبكة Render الداخلية الخاصة
      - key: DB_SSL
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

databases:
  - name: meethaq-db
    plan: free
    databaseName: meethaq
    user: meethaq_app
    postgresMajorVersion: "16"
